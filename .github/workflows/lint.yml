name: Lint

on:
  push:
    branches: [ "main" ]
    paths: &go-paths
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - .golangci.yml
      - .github/workflows/lint.yml
  pull_request:
    branches: [ "main" ]
    paths: *go-paths
  # New advisories land without any code change, so rescan weekly.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci-lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
