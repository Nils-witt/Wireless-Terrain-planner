name: Server Go test

on:
  push:
    branches: [ "main" ]
    paths: &go-paths
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/server-go-test.yml
  pull_request:
    branches: [ "main" ]
    paths: *go-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: Check go mod tidy
      run: go mod tidy -diff
    # go vet runs as part of golangci-lint (govet is in the standard set).
    - name: Test
      run: go test -race -shuffle=on ./...
