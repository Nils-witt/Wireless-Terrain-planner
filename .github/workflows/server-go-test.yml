name: Server Go test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: Check go mod tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum
    - name: Vet
      run: go vet ./...
    - name: Test
      run: go test -race -shuffle=on ./...
