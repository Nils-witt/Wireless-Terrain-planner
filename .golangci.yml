version: "2"

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
    staticcheck:
      checks:
        - all
        # The UTM series expansions are written as published; expanding
        # math.Pow into multiplications would hurt readability.
        - -QF1005
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
